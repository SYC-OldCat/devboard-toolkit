replay_list_template: |
  #!/bin/sh
  app_path={{APP_PATH}}
  app_log_name="${app_log_name:-log/app_log.txt}"
  input_material_list_txt="${input_material_list_txt:-{{LIST_FILE}}.txt}"

  #挂载素材
  _materialSharePath=//172.17.12.118/Model_Test/TestSpace/Personal_Space
  _materialMountPath=/tmp/iot_test/mnt_data

  mkdir -p ${_materialMountPath}
  mount -t cifs ${_materialSharePath} ${_materialMountPath} -o username=syc53636,password=@Ss19855468498,domain=arcsoft-hz

  export LD_LIBRARY_PATH=$PWD/lib:$LD_LIBRARY_PATH
  export materialInputPath=${input_material_list_txt}
  export materialSharePath=${_materialSharePath}
  export materialMountPath=${_materialMountPath}
  export outputMountPath=output/{{USER}}/{{DATE}}_{{APP_SUFFIX}}/{{CAR_MODEL}}
  export outputSharePath=output
  export calibrationFilename=$PWD/{{CALIBRATION}}.json
  export videoMode=1
  export debugMode=1
  export qALogLevel=0
  export carModel=
  export testLoopCount=1
  export testingType=1
  export runMode=manual
  export taskId=1
  export radarName=ars408
  export frameRate=25
  export adasEnable=1
  export signalMode=manual
  export frameRepeatTimes=1
  export disableResultSave=0
  export enablePreLoadSignalData=0

  # 跳过: 坏素材不中断剩余回灌
  _tmp_dir="replay_tmp"
  mkdir -p "${_tmp_dir}"
  _run_list="${_tmp_dir}/running_{{LIST_FILE}}.txt"
  _fail_list="${_tmp_dir}/failed_{{LIST_FILE}}.txt"
  _run_log="${_tmp_dir}/tmp_run_$$.log"
  _tmp_next="${_tmp_dir}/tmp_next_$$.txt"

  # 强制覆盖复制 (修复: 残留空 running_ 文件时不再跳过 cp, 避免 testbed 不运行直接"完成")
  cp "${input_material_list_txt}" "${_run_list}"

  # running_ 为空则直接报错退出 (分片为空或 cp 失败, 防止伪装成"无失败素材")
  if [ ! -s "${_run_list}" ]; then
    echo "[!] ERROR: 待跑清单 ${_run_list} 为空 (分片为空或复制失败), 回灌中止"
    exit 2
  fi


  _crash_hit=0
  while [ -s "${_run_list}" ]; do

    export materialInputPath="${_run_list}"
    ( MALLOC_ARENA_MAX=4 ./${app_path} ) 2>&1 | tee "${_run_log}"
    # 捕获实际 app 的退出码 (避免被 tee 干扰)
    set -o pipefail 2>/dev/null
    _app_exit=${PIPESTATUS[0]:-$?}
    set +o pipefail 2>/dev/null
    _ret_ok=0
    _fail_hit=0
    _local_crash=0

    if grep -q "testbed->run ret = 0" "${_run_log}"; then
      _ret_ok=1
    fi

    # 失败判定: 旧 pattern + crash/段错误 + 非0退出码
    if grep -Eq "testbed->run ret = [^0]|testbed_error_code:[1-9]|ERROR ARC_ADAS_Initial" "${_run_log}"; then
      _fail_hit=1
    fi
    if grep -Eq "=== CRASH: signal [0-9]+|Segmentation fault|Aborted \(|core dumped|Floating point exception|Illegal instruction" "${_run_log}"; then
      _fail_hit=1
      _local_crash=1
      _crash_hit=1
      echo "[CRASH] 感知包崩溃信号已识别" | tee -a "${_fail_list}"
    fi
    if [ "${_app_exit}" -ne 0 ] && [ "${_ret_ok}" -eq 0 ]; then
      # 没有明确成功打印且退出码非0 → 视为失败
      _fail_hit=1
      echo "[EXIT] 感知包非零退出 exit_code=${_app_exit}" | tee -a "${_fail_list}"
    fi

    if [ "${_ret_ok}" -eq 1 ] && [ "${_fail_hit}" -eq 0 ]; then
      rm -f "${_run_log}" "${_tmp_next}"
      break
    fi

    _bad_line=$(grep "Processing file:" "${_run_log}" | tail -n 1 | sed "s/.*Processing file: *//")
    if [ -z "${_bad_line}" ]; then
      _bad_line=$(head -n 1 "${_run_list}")
    fi

    echo "${_bad_line}" >> "${_fail_list}"
    echo "[SKIP] 坏素材: ${_bad_line}"
    awk -v pat="${_bad_line}" "BEGIN{f=0} \$0==pat{f=1;next} f" "${_run_list}" > "${_tmp_next}"
    _old_cnt=$(wc -l < "${_run_list}")
    _new_cnt=$(wc -l < "${_tmp_next}" 2>/dev/null || echo 0)

    if [ "${_old_cnt}" = "${_new_cnt}" ] || [ "${_new_cnt}" = "0" ]; then
      _first_line=$(head -n 1 "${_run_list}")
      if [ "${_first_line}" != "${_bad_line}" ]; then
        echo "${_first_line}" >> "${_fail_list}"
        echo "[SKIP] 兜底删除首行: ${_first_line}"
      fi
      tail -n +2 "${_run_list}" > "${_tmp_next}"
    fi
    mv "${_tmp_next}" "${_run_list}"
    rm -f "${_run_log}"
  done

  if [ -s "${_fail_list}" ]; then
    echo ""
    echo "[!] 本分片失败素材已保存: $(pwd)/${_fail_list} ($(wc -l < "${_fail_list}") 条)"
  else
    echo "[*] 本分片无失败素材"
  fi
  # 脚本退出码反映实际成败 (per_board_runner 据此写 .done)
  if [ "${_crash_hit}" -eq 1 ]; then
    exit 4
  elif [ -s "${_fail_list}" ]; then
    exit 3
  else
    exit 0
  fi

