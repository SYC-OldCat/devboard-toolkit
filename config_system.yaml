# ============================================================
# 系统配置 (config_system.yaml)
# 随程序版本发布，自动更新时默认更新
# 包含：阈值、脚本模板、数据处理车型映射
# ============================================================
usage_check:
  loadavg_threshold: 4.0
  net_rx_threshold_gb: 1.0

# 数据处理车型映射 (data_preproc/classifier.py 使用)
# title_keywords: Jira 标题匹配 (summary 含 key → 取 value 车型编号)
# path_keywords:  视频路径匹配 (path 含 key → 取 value 车型编号)
# default:        都不命中时的兜底车型
data_proc_car_keywords:
  title_keywords:
    "463车": "463"
    "508车": "508"
    "3545车": "3545"
    "3554车": "3554"
    "3637车": "3637"
    "5436车": "5463"
    "5463车": "5463"
    "1604车": "1604"
  path_keywords:
    "0463": "463"
    "0508": "508"
    "3545": "3545"
    "3554": "3554"
    "3637": "3637"
    "5436": "5463"
    "5463": "5463"
    "1604": "1604"
  default: "0452"

# ============================================================
# 列表回灌脚本模板
# 占位符: {{APP_PATH}} {{APP_SUFFIX}} {{USER}} {{DATE}} {{CAR_MODEL}}
#        {{CALIBRATION}} {{LIST_FILE}}
# ============================================================
replay_list_template: |
  #!/bin/sh
  app_path={{APP_PATH}}
  app_log_name="${app_log_name:-log/app_log.txt}"
  input_material_list_txt="${input_material_list_txt:-{{LIST_FILE}}.txt}"

  #挂载素材
  _materialSharePath=//172.17.12.118/Model_Test/TestSpace/Personal_Space
  _materialMountPath=/tmp/iot_test/mnt_data

  mkdir -p ${_materialMountPath}
  mount -t cifs ${_materialSharePath} ${_materialMountPath} -o username=syc53636,password=@Ss19855468498,domain=arcsoft-hz

  export LD_LIBRARY_PATH=$PWD/lib:$LD_LIBRARY_PATH
  export materialInputPath=${input_material_list_txt}
  export materialSharePath=${_materialSharePath}
  export materialMountPath=${_materialMountPath}
  export outputMountPath=output/{{USER}}/{{DATE}}_{{APP_SUFFIX}}/{{CAR_MODEL}}
  export outputSharePath=output
  export calibrationFilename=$PWD/{{CALIBRATION}}.json
  export videoMode=1
  export debugMode=1
  export qALogLevel=0
  export carModel=
  export testLoopCount=1
  export testingType=1
  export runMode=manual
  export taskId=1
  export radarName=ars408
  export frameRate=25
  export adasEnable=1
  export signalMode=manual
  export frameRepeatTimes=1
  export disableResultSave=0
  export enablePreLoadSignalData=0

  # 跳过: 坏素材不中断剩余回灌
  _tmp_dir="replay_tmp"
  mkdir -p "${_tmp_dir}"
  _run_list="${_tmp_dir}/running_{{LIST_FILE}}.txt"
  _fail_list="${_tmp_dir}/failed_{{LIST_FILE}}.txt"
  _run_log="${_tmp_dir}/tmp_run_$$.log"
  _tmp_next="${_tmp_dir}/tmp_next_$$.txt"

  # 强制覆盖复制 (修复: 残留空 running_ 文件时不再跳过 cp, 避免 testbed 不运行直接"完成")
  cp "${input_material_list_txt}" "${_run_list}"

  # running_ 为空则直接报错退出 (分片为空或 cp 失败, 防止伪装成"无失败素材")
  if [ ! -s "${_run_list}" ]; then
    echo "[!] ERROR: 待跑清单 ${_run_list} 为空 (分片为空或复制失败), 回灌中止"
    exit 2
  fi


  # 单次跑: testbed 遇到坏素材会自动跳过并继续跑后续素材, 无需循环重跑
  export materialInputPath="${_run_list}"
  _exit_code_file="${_tmp_dir}/exit_$$.tmp"
  ( MALLOC_ARENA_MAX=4 ./${app_path}; echo $? > "${_exit_code_file}" ) 2>&1 | tee "${_run_log}"
  _app_exit=$(cat "${_exit_code_file}" 2>/dev/null)
  rm -f "${_exit_code_file}"
  [ -z "${_app_exit}" ] && _app_exit=1

  # 等待 tee flush 到磁盘 (消除 I/O 竞态: grep 读磁盘时 tee 还没写完导致漏匹配)
  sync
  sleep 1

  # 检测 CRASH (真板级失败, 需丢弃接力)
  _crash_hit=0
  if [ -s "${_run_log}" ] && grep -Eq "=== CRASH: signal [0-9]+|Segmentation fault|Aborted \(|core dumped|Floating point exception|Illegal instruction" "${_run_log}"; then
    _crash_hit=1
    echo "[CRASH] 感知包崩溃信号已识别" | tee -a "${_fail_list}"
  fi

  # 检测 testbed 是否正常跑完 (3 个条件任一命中即算成功, 多重兜底避免 I/O 竞态误判):
  #   1. 日志中有 "testbed->run ret = 0" (感知包显式返回 0)
  #   2. 日志中有 "testbed task end"     (任务收尾正常结束)
  #   3. 感知包实际退出码 _app_exit=0    (即使日志 grep 未命中, 进程码也能兜底)
  _done_ok=0
  if [ -s "${_run_log}" ] && grep -q "testbed->run ret = 0" "${_run_log}"; then
    _done_ok=1
  elif [ -s "${_run_log}" ] && grep -q "testbed task end" "${_run_log}"; then
    _done_ok=1
  elif [ "${_app_exit}" = "0" ]; then
    _done_ok=1
  fi

  # 脚本退出码反映实际成败 (per_board_runner 据此写 .done)
  if [ "${_crash_hit}" -eq 1 ]; then
    echo "[!] 本分片感知包 CRASH, 失败信息已保存: $(pwd)/${_fail_list}"
    rm -f "${_run_log}" "${_tmp_next}"
    exit 4
  elif [ "${_done_ok}" -eq 1 ]; then
    # testbed 正常跑完 (坏素材已自动跳过), 视为成功, 不影响接力
    rm -f "${_fail_list}" "${_run_log}" "${_tmp_next}"
    echo "[*] 本分片回灌完成"
    exit 0
  else
    # testbed 未正常完成 (无 ret=0/task end 且无 CRASH), 保留日志供排查
    echo "[!] testbed 未正常完成 (exit=${_app_exit}), 日志已保存: $(pwd)/${_run_log}"
    rm -f "${_tmp_next}"
    exit 1
  fi

# ============================================================
# SDK 回灌脚本模板 (单板, 素材相对路径输入)
# 占位符: {{APP_PATH}} {{USER}} {{DATE}} {{APP_SUFFIX}}
#        {{CAR_MODEL}} {{CALIBRATION}} {{INPUT_SUBPATH}}
# ============================================================
replay_sdk_template: |
  #!/bin/sh

  app_path={{APP_PATH}}
  app_log_name=app_log.txt
  input_material_list_txt=$PWD/input/{{INPUT_SUBPATH}}
  _materialSharePath=//172.17.12.118/Model_Test/TestSpace/Personal_Space
  _materialMountPath=/mnt

  export LD_LIBRARY_PATH=$PWD/lib:$LD_LIBRARY_PATH
  export materialInputPath=${input_material_list_txt}
  export materialSharePath=${_materialSharePath}
  export materialMountPath=${_materialMountPath}
  export outputMountPath=output/{{USER}}/{{DATE}}_{{APP_SUFFIX}}/{{CAR_MODEL}}
  export outputSharePath=
  export calibrationFilename=$PWD/{{CALIBRATION}}.json
  export videoMode=1
  export debugMode=4
  export qALogLevel=0
  export carModel=
  export testLoopCount=1
  export testingType=1
  export runMode=manual
  export taskId=1
  export radarName=Radar
  export frameRate=25
  export adasEnable=1
  export signalMode=manual
  export frameRepeatTimes=1
  export disableResultSave=0
  export enablePreLoadSignalData=0
  env MALLOC_ARENA_MAX=4 ./${app_path}
